# SHOSHO — staging stack on the shared server (/home/shos/shosho/staging), rootless docker as `shos`.
# Co-tenant terms (memory/infra-access.md): publish ONLY on 127.0.0.1:8200–8299, total RAM < 512M.
# Host nginx (managed by TETA+PI, not by us) fronts 127.0.0.1:8200 as https://shos.hellfiresol.com.
# Images are built by CI (.github/workflows/deploy-staging.yml) and pushed to GHCR.
name: shosho-staging

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "2" }

services:
  web:
    <<: *common
    image: ${WEB_IMAGE:-ghcr.io/shorobot/shosho-web:staging}
    ports:
      - "127.0.0.1:8200:3000"
    environment:
      # read at request time by apps/web (lib/env.ts) — the image is built without Supabase values
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://shos.hellfiresol.com}
    mem_limit: 96m
    memswap_limit: 96m

  backoffice:
    <<: *common
    image: ${BACKOFFICE_IMAGE:-ghcr.io/shorobot/shosho-backoffice:staging}
    ports:
      # not exposed publicly yet — reachable over ssh port-forward until S1 decides the host (S1-04 proposal)
      - "127.0.0.1:8202:3000"
    environment:
      # read at request time by apps/backoffice (lib/env.ts); anon key only, RLS + staff session guard the data
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    mem_limit: 96m
    memswap_limit: 96m

  # api: REMOVED 2026-09-27 by D-013 — the FastAPI placeholder was idle at ~35 MiB while holding a
  #   160 MiB limit, ~31% of the slice's 512 MiB cap, for a service no session uses yet.
  #   To restore when S5 Automation ships a real FastAPI service, re-add here and in
  #   .github/workflows/_deploy.yml (search D-013 there — image build/push and the health probe):
  #     api:
  #       <<: *common
  #       image: ${API_IMAGE:-ghcr.io/shorobot/shosho-api:staging}
  #       ports:
  #         - "127.0.0.1:8201:8000"      # 8201 stays reserved for us (TETA+PI informed it is idle)
  #       environment:
  #         SUPABASE_URL: ${SUPABASE_URL:-}
  #         SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  #         ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  #       mem_limit: 160m                # re-size from measurement, do not copy this number
  #       memswap_limit: 160m
