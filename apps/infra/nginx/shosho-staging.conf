# SHOSHO staging — host nginx vhost. Installed by scripts/server-bootstrap.sh to
# /etc/nginx/sites-available/shosho-staging (symlinked into sites-enabled).
# TLS: certbot (Let's Encrypt) for the sslip.io host; when the real domain arrives
# and goes behind Cloudflare, add its name to server_name (TLS then terminates at CF).
#
# Upstreams (all 127.0.0.1, see docker-compose.staging.yml):
#   web  -> 3100   api -> 8100   n8n -> 5678

server {
    listen 80;
    server_name __STAGING_HOST__;

    location /api/ {
        proxy_pass http://127.0.0.1:8100/;
        include snippets/shosho-proxy.conf;
    }

    location /n8n/ {
        proxy_pass http://127.0.0.1:5678/;
        include snippets/shosho-proxy.conf;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100/;
        include snippets/shosho-proxy.conf;
    }
}
