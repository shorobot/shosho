# Reusable deploy: build images → push to GHCR → ssh to server → docker compose pull/up → health.
# Called by deploy-staging.yml (env=staging) and deploy-prod.yml (env=production) — neither caller
# passes secrets (no `secrets:` key, no `inherit`; S7-01 task 3 flagged `inherit` as unnecessarily
# broad). Secrets are ENVIRONMENT secrets (repo is public): the `deploy` job below declares
# `environment:` on itself and reads `<secret_prefix>_*` straight from it — e.g. STAGING_SSH_KEY lives
# only in environment `staging`, which only `main` may deploy to — and a job-level `environment:`
# resolves that environment's secrets directly, taking priority over anything a caller would forward.
# Nothing sensitive at repo level.
# Server side runs as an unprivileged co-tenant user with ROOTLESS docker (memory/infra-access.md):
# no sudo, DOCKER_HOST points at the user's socket, everything lives under $HOME.
name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name (staging | production)
        required: true
        type: string
      image_tag:
        description: Image tag to build/deploy (staging | vX.Y.Z)
        required: true
        type: string
      remote_dir:
        description: Directory on the server (must be inside the deploy user's home)
        required: true
        type: string
      web_port:
        description: Host port (127.0.0.1) the web container publishes — used by the health check
        required: false
        type: string
        default: "8200"
      # api_port: REMOVED by D-013 (2026-09-27) with the api service itself. Port 8201 stays
      #   reserved for SH.OS but nothing listens on it. Restore this input, the build step and the
      #   health probe together when S5 ships a real FastAPI service.
      backoffice_port:
        description: Host port (127.0.0.1) the back-office container publishes — used by the health check
        required: false
        type: string
        default: "8202"
      secret_prefix:
        description: Prefix of the environment secrets to use (STAGING | PROD)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build & push images
    runs-on: ubuntu-24.04
    outputs:
      web_image: ${{ steps.meta.outputs.web }}
      backoffice_image: ${{ steps.meta.outputs.backoffice }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build contexts
        id: ctx
        # web / backoffice: their Dockerfile builds from the repo root (pnpm workspace).
        # No api context: D-013 dropped the placeholder. S5 re-adds `api=apps/automation` here.
        run: |
          if [ -f apps/web/Dockerfile ]; then echo "web=." >> "$GITHUB_OUTPUT"; echo "web_file=apps/web/Dockerfile" >> "$GITHUB_OUTPUT"; else echo "web=apps/infra/placeholder-web" >> "$GITHUB_OUTPUT"; echo "web_file=apps/infra/placeholder-web/Dockerfile" >> "$GITHUB_OUTPUT"; fi
          if [ -f apps/backoffice/Dockerfile ]; then echo "bo=." >> "$GITHUB_OUTPUT"; echo "bo_file=apps/backoffice/Dockerfile" >> "$GITHUB_OUTPUT"; else echo "bo=apps/infra/placeholder-web" >> "$GITHUB_OUTPUT"; echo "bo_file=apps/infra/placeholder-web/Dockerfile" >> "$GITHUB_OUTPUT"; fi

      - name: Image names
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "web=ghcr.io/${OWNER}/shosho-web:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "backoffice=ghcr.io/${OWNER}/shosho-backoffice:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cache export is best-effort (ignore-error): a GHA cache "failed to reserve cache" must never block a deploy.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.web }}
          file: ${{ steps.ctx.outputs.web_file }}
          push: true
          tags: ${{ steps.meta.outputs.web }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true

      # D-013: the api image build/push lived here. Restoring it is this block plus the
      # `api` lines in `Resolve build contexts` / `Image names` / the job outputs:
      #   - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      #     with:
      #       context: ${{ steps.ctx.outputs.api }}
      #       push: true
      #       tags: ${{ steps.meta.outputs.api }}
      #       labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      #       cache-from: type=gha,scope=api
      #       cache-to: type=gha,scope=api,mode=max,ignore-error=true

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.ctx.outputs.bo }}
          file: ${{ steps.ctx.outputs.bo_file }}
          push: true
          tags: ${{ steps.meta.outputs.backoffice }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backoffice
          cache-to: type=gha,scope=backoffice,mode=max,ignore-error=true

  deploy:
    name: deploy to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      REMOTE_DIR: ${{ inputs.remote_dir }}
      WEB_PORT: ${{ inputs.web_port }}
      BO_PORT: ${{ inputs.backoffice_port }}
      # Environment secrets, looked up by prefix (STAGING_SSH_HOST, PROD_SSH_HOST, …).
      SSH_HOST: ${{ secrets[format('{0}_SSH_HOST', inputs.secret_prefix)] }}
      SSH_USER: ${{ secrets[format('{0}_SSH_USER', inputs.secret_prefix)] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets[format('{0}_SSH_KEY', inputs.secret_prefix)] }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          [ -s ~/.ssh/deploy ] || { echo "::error::${{ inputs.secret_prefix }}_SSH_KEY is empty — is it set in environment '${{ inputs.environment }}'?"; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOT
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
          EOT

      - name: Render .env from secrets
        # The server never holds secrets outside this file; GitHub Secrets is the source of truth.
        # D-013: SUPABASE_SERVICE_ROLE_KEY and ANTHROPIC_API_KEY are deliberately NOT rendered any
        # more — the api container was their only consumer, and this file lands on a shared host, so
        # a service-role key with no reader is pure exposure. Restore them next to the api service, in
        # the same secrets[format(...)] / secrets.NAME shape as the lines below. Keep this note out of
        # the heredoc: anything inside it is written verbatim into the server's .env.
        run: |
          cat > env.rendered <<EOT
          WEB_IMAGE=${{ needs.build.outputs.web_image }}
          BACKOFFICE_IMAGE=${{ needs.build.outputs.backoffice_image }}
          SUPABASE_URL=${{ secrets[format('{0}_SUPABASE_URL', inputs.secret_prefix)] }}
          SUPABASE_ANON_KEY=${{ secrets[format('{0}_SUPABASE_ANON_KEY', inputs.secret_prefix)] }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets[format('{0}_SUPABASE_URL', inputs.secret_prefix)] }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets[format('{0}_SUPABASE_ANON_KEY', inputs.secret_prefix)] }}
          NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_URL }}
          EOT

      - name: Upload compose + env
        run: |
          ssh target "mkdir -p '$REMOTE_DIR'"
          scp -q apps/infra/docker-compose.staging.yml "target:$REMOTE_DIR/docker-compose.yml"
          scp -q env.rendered "target:$REMOTE_DIR/.env"
          ssh target "chmod 600 '$REMOTE_DIR/.env'"

      - name: Pull & up (rootless docker)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Token goes over stdin only — never on the remote command line (shared host, /proc is readable).
          printf '%s' "$GHCR_TOKEN" | ssh target "export DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock; docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null"
          ssh target "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'EOT'
          set -euo pipefail
          # Non-login ssh shells do not read ~/.profile → point at the rootless daemon explicitly.
          export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
          docker info --format 'daemon {{.ServerVersion}} rootless={{range .SecurityOptions}}{{if eq . "name=rootless"}}yes{{end}}{{end}}'
          cd "$REMOTE_DIR"
          docker compose pull -q
          docker compose up -d --remove-orphans
          docker logout ghcr.io >/dev/null
          docker image prune -f >/dev/null
          EOT

      - name: Health (on the server, 127.0.0.1 only)
        run: |
          # D-013: the api probe (`curl 127.0.0.1:$API_PORT/health`) was removed with the service.
          # pipefail: the runner's shell is `bash -e {0}` with no pipefail (S1-04), and so is this
          # remote bash — keep it explicit on both sides.
          set -euo pipefail
          ssh target "REMOTE_DIR='$REMOTE_DIR' WEB_PORT='$WEB_PORT' BO_PORT='$BO_PORT' bash -s" <<'EOT'
          set -euo pipefail
          export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
          for i in $(seq 1 20); do
            web=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${WEB_PORT}/" || true)
            # back-office: /login is the only page without a session (the rest 307 there)
            bo=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${BO_PORT}/login" || true)
            echo "try $i: web=$web backoffice=$bo"
            if [ "$web" = 200 ] && [ "$bo" = 200 ]; then
              curl -fsS "http://127.0.0.1:${WEB_PORT}/" | grep -oE '<title>[^<]*' || true
              curl -fsS "http://127.0.0.1:${BO_PORT}/login" | grep -oE '<title>[^<]*' || true
              echo "--- memory (cgroup slice of user $(id -u), limit 512M) ---"
              C="/sys/fs/cgroup/user.slice/user-$(id -u).slice"
              for f in memory.current memory.peak; do
                v=$(cat "$C/$f" 2>/dev/null || echo 0); echo "$f=$((v/1048576))MiB"
              done
              sed -n 's/^max /memory.events.max=/p' "$C/memory.events" 2>/dev/null || true
              grep -E '^(anon|file|kernel) ' "$C/memory.stat" 2>/dev/null || true
              docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}' || true
              exit 0
            fi
            sleep 5
          done
          cd "$REMOTE_DIR" && docker compose ps && docker compose logs --tail 50
          exit 1
          EOT

      - name: Public URL (informational — edge/TLS is owned by TETA+PI / Cloudflare, not by us)
        if: vars.PUBLIC_URL != ''
        run: |
          curl -sS -o /dev/null -m 20 -w 'public: %{http_code} %{url_effective}\n' "${{ vars.PUBLIC_URL }}" \
            || echo "::warning::public URL ${{ vars.PUBLIC_URL }} not reachable (see memory/infra-access.md — CF SSL / vhost issue)"
