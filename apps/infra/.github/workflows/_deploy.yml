# Reusable deploy: build images → push to GHCR → ssh to server → docker compose pull/up → health.
# Called by deploy-staging.yml (env=staging) and deploy-prod.yml (env=production) with `secrets: inherit`.
# Secrets are ENVIRONMENT secrets (repo is public): the deploy job declares `environment:` and reads
# `<secret_prefix>_*` from it — e.g. STAGING_SSH_KEY lives only in environment `staging`, which only
# `main` may deploy to. Nothing sensitive at repo level.
# Server side runs as an unprivileged co-tenant user with ROOTLESS docker (memory/infra-access.md):
# no sudo, DOCKER_HOST points at the user's socket, everything lives under $HOME.
name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name (staging | production)
        required: true
        type: string
      image_tag:
        description: Image tag to build/deploy (staging | vX.Y.Z)
        required: true
        type: string
      remote_dir:
        description: Directory on the server (must be inside the deploy user's home)
        required: true
        type: string
      web_port:
        description: Host port (127.0.0.1) the web container publishes — used by the health check
        required: false
        type: string
        default: "8200"
      api_port:
        description: Host port (127.0.0.1) the api container publishes — used by the health check
        required: false
        type: string
        default: "8201"
      secret_prefix:
        description: Prefix of the environment secrets to use (STAGING | PROD)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build & push images
    runs-on: ubuntu-24.04
    outputs:
      web_image: ${{ steps.meta.outputs.web }}
      api_image: ${{ steps.meta.outputs.api }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve build contexts
        id: ctx
        # Placeholders until real Dockerfiles land in apps/web and apps/automation.
        run: |
          if [ -f apps/web/Dockerfile ]; then echo "web=apps/web" >> "$GITHUB_OUTPUT"; else echo "web=apps/infra/placeholder-web" >> "$GITHUB_OUTPUT"; fi
          if [ -f apps/automation/Dockerfile ]; then echo "api=apps/automation" >> "$GITHUB_OUTPUT"; else echo "api=apps/infra/placeholder-api" >> "$GITHUB_OUTPUT"; fi

      - name: Image names
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "web=ghcr.io/${OWNER}/shosho-web:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${OWNER}/shosho-api:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cache export is best-effort (ignore-error): a GHA cache "failed to reserve cache" must never block a deploy.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.ctx.outputs.web }}
          push: true
          tags: ${{ steps.meta.outputs.web }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max,ignore-error=true

      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.ctx.outputs.api }}
          push: true
          tags: ${{ steps.meta.outputs.api }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max,ignore-error=true

  deploy:
    name: deploy to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      REMOTE_DIR: ${{ inputs.remote_dir }}
      WEB_PORT: ${{ inputs.web_port }}
      API_PORT: ${{ inputs.api_port }}
      # Environment secrets, looked up by prefix (STAGING_SSH_HOST, PROD_SSH_HOST, …).
      SSH_HOST: ${{ secrets[format('{0}_SSH_HOST', inputs.secret_prefix)] }}
      SSH_USER: ${{ secrets[format('{0}_SSH_USER', inputs.secret_prefix)] }}
    steps:
      - uses: actions/checkout@v7

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets[format('{0}_SSH_KEY', inputs.secret_prefix)] }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          [ -s ~/.ssh/deploy ] || { echo "::error::${{ inputs.secret_prefix }}_SSH_KEY is empty — is it set in environment '${{ inputs.environment }}'?"; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOT
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
          EOT

      - name: Render .env from secrets
        # The server never holds secrets outside this file; GitHub Secrets is the source of truth.
        run: |
          cat > env.rendered <<EOT
          WEB_IMAGE=${{ needs.build.outputs.web_image }}
          API_IMAGE=${{ needs.build.outputs.api_image }}
          SUPABASE_URL=${{ secrets[format('{0}_SUPABASE_URL', inputs.secret_prefix)] }}
          SUPABASE_ANON_KEY=${{ secrets[format('{0}_SUPABASE_ANON_KEY', inputs.secret_prefix)] }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets[format('{0}_SUPABASE_SERVICE_ROLE_KEY', inputs.secret_prefix)] }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOT

      - name: Upload compose + env
        run: |
          ssh target "mkdir -p '$REMOTE_DIR'"
          scp -q apps/infra/docker-compose.staging.yml "target:$REMOTE_DIR/docker-compose.yml"
          scp -q env.rendered "target:$REMOTE_DIR/.env"
          ssh target "chmod 600 '$REMOTE_DIR/.env'"

      - name: Pull & up (rootless docker)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # Token goes over stdin only — never on the remote command line (shared host, /proc is readable).
          printf '%s' "$GHCR_TOKEN" | ssh target "export DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock; docker login ghcr.io -u '$GHCR_USER' --password-stdin >/dev/null"
          ssh target "REMOTE_DIR='$REMOTE_DIR' bash -s" <<'EOT'
          set -euo pipefail
          # Non-login ssh shells do not read ~/.profile → point at the rootless daemon explicitly.
          export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
          docker info --format 'daemon {{.ServerVersion}} rootless={{range .SecurityOptions}}{{if eq . "name=rootless"}}yes{{end}}{{end}}'
          cd "$REMOTE_DIR"
          docker compose pull -q
          docker compose up -d --remove-orphans
          docker logout ghcr.io >/dev/null
          docker image prune -f >/dev/null
          EOT

      - name: Health (on the server, 127.0.0.1 only)
        run: |
          ssh target "REMOTE_DIR='$REMOTE_DIR' WEB_PORT='$WEB_PORT' API_PORT='$API_PORT' bash -s" <<'EOT'
          set -e
          export DOCKER_HOST="unix:///run/user/$(id -u)/docker.sock"
          for i in $(seq 1 20); do
            web=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${WEB_PORT}/" || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${API_PORT}/health" || true)
            echo "try $i: web=$web api=$api"
            if [ "$web" = 200 ] && [ "$api" = 200 ]; then
              curl -fsS "http://127.0.0.1:${WEB_PORT}/" | grep -o 'SHOSHO staging OK' || true
              curl -fsS "http://127.0.0.1:${API_PORT}/health"; echo
              echo "--- memory (cgroup slice of user $(id -u), limit 512M) ---"
              m=$(cat "/sys/fs/cgroup/user.slice/user-$(id -u).slice/memory.current" 2>/dev/null || echo 0)
              echo "memory.current=$((m/1024/1024))M"
              docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}' || true
              exit 0
            fi
            sleep 5
          done
          cd "$REMOTE_DIR" && docker compose ps && docker compose logs --tail 50
          exit 1
          EOT

      - name: Public URL (informational — edge/TLS is owned by TETA+PI / Cloudflare, not by us)
        if: vars.PUBLIC_URL != ''
        run: |
          curl -sS -o /dev/null -m 20 -w 'public: %{http_code} %{url_effective}\n' "${{ vars.PUBLIC_URL }}" \
            || echo "::warning::public URL ${{ vars.PUBLIC_URL }} not reachable (see memory/infra-access.md — CF SSL / vhost issue)"
