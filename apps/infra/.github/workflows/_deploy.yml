# Reusable deploy: build images → push to GHCR → ssh to server → docker compose pull/up → health.
# Called by deploy-staging.yml (env=staging) and deploy-prod.yml (env=production).
name: _deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name (staging | production)
        required: true
        type: string
      image_tag:
        description: Image tag to build/deploy (staging | vX.Y.Z)
        required: true
        type: string
      remote_dir:
        description: Directory on the server
        required: true
        type: string
    secrets:
      SSH_HOST: { required: true }
      SSH_USER: { required: true }
      SSH_KEY: { required: true }
      N8N_ENCRYPTION_KEY: { required: true }
      N8N_BASIC_AUTH_USER: { required: true }
      N8N_BASIC_AUTH_PASSWORD: { required: true }
      SUPABASE_URL: { required: false }
      SUPABASE_ANON_KEY: { required: false }
      SUPABASE_SERVICE_ROLE_KEY: { required: false }
      ANTHROPIC_API_KEY: { required: false }

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build & push images
    runs-on: ubuntu-latest
    outputs:
      web_image: ${{ steps.meta.outputs.web }}
      api_image: ${{ steps.meta.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build contexts
        id: ctx
        # Placeholders until real Dockerfiles land in apps/web and apps/automation.
        run: |
          if [ -f apps/web/Dockerfile ]; then echo "web=apps/web" >> "$GITHUB_OUTPUT"; else echo "web=apps/infra/placeholder-web" >> "$GITHUB_OUTPUT"; fi
          if [ -f apps/automation/Dockerfile ]; then echo "api=apps/automation" >> "$GITHUB_OUTPUT"; else echo "api=apps/infra/placeholder-api" >> "$GITHUB_OUTPUT"; fi

      - name: Image names
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "web=ghcr.io/${OWNER}/shosho-web:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${OWNER}/shosho-api:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.web }}
          push: true
          tags: ${{ steps.meta.outputs.web }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.api }}
          push: true
          tags: ${{ steps.meta.outputs.api }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: deploy to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH setup
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Render .env from secrets
        # The server never holds secrets outside this file; GitHub Secrets is the source of truth.
        run: |
          cat > env.rendered <<EOT
          WEB_IMAGE=${{ needs.build.outputs.web_image }}
          API_IMAGE=${{ needs.build.outputs.api_image }}
          N8N_HOST=${{ vars.PUBLIC_HOST }}
          N8N_WEBHOOK_URL=https://${{ vars.PUBLIC_HOST }}/n8n/
          N8N_ENCRYPTION_KEY=${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_BASIC_AUTH_USER=${{ secrets.N8N_BASIC_AUTH_USER }}
          N8N_BASIC_AUTH_PASSWORD=${{ secrets.N8N_BASIC_AUTH_PASSWORD }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          EOT

      - name: Upload compose + env
        run: |
          S="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh -i ~/.ssh/deploy "$S" "mkdir -p '${{ inputs.remote_dir }}'"
          scp -i ~/.ssh/deploy apps/infra/docker-compose.staging.yml "$S:${{ inputs.remote_dir }}/docker-compose.yml"
          scp -i ~/.ssh/deploy env.rendered "$S:${{ inputs.remote_dir }}/.env"
          ssh -i ~/.ssh/deploy "$S" "chmod 600 '${{ inputs.remote_dir }}/.env'"

      - name: Pull & up
        run: |
          S="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh -i ~/.ssh/deploy "$S" bash -s <<'EOT'
          set -euo pipefail
          cd "${{ inputs.remote_dir }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          docker compose pull -q
          docker compose up -d --remove-orphans
          docker logout ghcr.io >/dev/null
          docker image prune -f >/dev/null
          EOT

      - name: Health
        run: |
          S="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          ssh -i ~/.ssh/deploy "$S" bash -s <<'EOT'
          set -e
          for i in $(seq 1 20); do
            web=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8100/health || true)
            echo "try $i: web=$web api=$api"
            [ "$web" = 200 ] && [ "$api" = 200 ] && exit 0
            sleep 5
          done
          cd "${{ inputs.remote_dir }}" && docker compose ps
          exit 1
          EOT
          curl -fsS -o /dev/null -w 'public: %{http_code} %{url_effective}\n' "${{ vars.PUBLIC_URL }}"
