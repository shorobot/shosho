name: Deploy staging

# Chain on main (D-005: staging = main, auto-deploy):  CI ──▶ Migrate staging ──▶ Deploy staging.
# Runs only after the schema push succeeded, so code never ships against a failed migration.
# Target: shared droplet, user `shos`, rootless docker, 127.0.0.1:8200 (web) / :8202 (back-office) — D-004.
# :8201 stays reserved for SH.OS but is idle — D-013 dropped the api placeholder (2026-09-27).
on:
  workflow_run:
    workflows: [Migrate staging]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Caller must grant what _deploy.yml needs (packages: write for GHCR); the repo default token is read-only
# and a called workflow cannot exceed its caller → otherwise "startup_failure" (seen in S1-01 runs).
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image_tag: staging
      remote_dir: /home/shos/shosho/staging
      web_port: "8200"
      backoffice_port: "8202"
      secret_prefix: STAGING
    # No secrets passed: _deploy.yml's `deploy` job declares `environment: staging` on itself, so
    # GitHub resolves STAGING_* directly from that environment regardless of what this caller forwards
    # (confirmed: a job-level `environment:` takes priority over anything passed from the caller).
    # `secrets: inherit` therefore handed the callee the repo's entire secret set for no reason — S7-01
    # task 3 flagged it; removed rather than replaced with a map, since nothing needs to cross the call.
