name: Deploy staging

# Chain on main (D-005: staging = main, auto-deploy):  CI ──▶ Migrate staging ──▶ Deploy staging.
# Runs only after the schema push succeeded, so code never ships against a failed migration.
# Target: shared droplet, user `shos`, rootless docker, 127.0.0.1:8200 (web) / :8202 (back-office) — D-004.
# :8201 stays reserved for SH.OS but is idle — D-013 dropped the api placeholder (2026-09-27).
on:
  workflow_run:
    workflows: [Migrate staging]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Caller must grant what _deploy.yml needs (packages: write for GHCR); the repo default token is read-only
# and a called workflow cannot exceed its caller → otherwise "startup_failure" (seen in S1-01 runs).
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image_tag: staging
      remote_dir: /home/shos/shosho/staging
      web_port: "8200"
      backoffice_port: "8202"
      secret_prefix: STAGING
    # RESTORED by S0 2026-10-07 after it broke the live deploy. S1-07 removed `secrets: inherit` on
    # the reasoning that a job-level `environment:` in _deploy.yml resolves STAGING_* on its own. That
    # is true for a *static* `secrets.NAME` reference, but _deploy.yml reads these through a DYNAMIC
    # index — `secrets[format('{0}_SSH_KEY', inputs.secret_prefix)]` — and in a called workflow the
    # `secrets` context is populated only from what the caller passes. Measured, not argued: run
    # 37640250636 failed at "SSH setup" with the key empty, caught by S1-04's own `[ -s ]` guard.
    # Narrowing this properly means giving _deploy.yml named `secrets:` inputs instead of the dynamic
    # prefix — a restructure, filed as proposed/S1-explicit-secrets-map.md. Do not remove this again
    # without that restructure and a real `Deploy staging` run to prove it.
    secrets: inherit
