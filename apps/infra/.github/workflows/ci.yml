name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, backoffice]
    steps:
      - uses: actions/checkout@v4

      - name: Detect package.json
        id: detect
        run: |
          if [ -f "apps/${{ matrix.app }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.app }} has no package.json yet — no-op"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present test

  python:
    name: python (automation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect python project
        id: detect
        run: |
          if [ -f apps/automation/pyproject.toml ] || [ -f apps/automation/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/automation has no pyproject/requirements yet — no-op"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: |
          python -m pip install --upgrade pip ruff pytest
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: ruff check . && ruff format --check .

      - name: Pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: pytest -q || [ $? -eq 5 ]   # exit 5 = no tests collected → ok

  infra:
    name: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Workflows in sync (apps/infra/.github ↔ .github)
        run: diff -r apps/infra/.github/workflows .github/workflows

      - name: Compose files valid
        working-directory: apps/infra
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          N8N_HOST=x N8N_WEBHOOK_URL=x N8N_ENCRYPTION_KEY=x N8N_BASIC_AUTH_USER=x N8N_BASIC_AUTH_PASSWORD=x \
            docker compose -f docker-compose.staging.yml config -q

      - name: Ruff (placeholder-api)
        run: pipx run ruff check apps/infra/placeholder-api

      - name: Placeholder images build
        run: |
          docker build -q apps/infra/placeholder-api
          docker build -q apps/infra/placeholder-web

  # Single required status check for branch protection.
  ci:
    name: CI
    if: always()
    needs: [node, python, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
