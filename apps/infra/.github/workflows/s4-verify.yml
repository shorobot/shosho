# TEMPORARY (S4-01): Playwright smoke for apps/backoffice against a local Supabase stack.
# The permanent `node (backoffice)` CI job runs lint/typecheck/vitest only — Playwright needs a real
# backend (seed staff logins) and PR jobs never see the staging secrets. Removed before the PR merges.
name: S4 verify

on:
  workflow_dispatch:
  push:
    branches: [s4-01]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (migrations + seed)
        working-directory: apps/backend
        run: pnpm exec supabase start
      - name: Playwright browsers
        run: pnpm --filter @shosho/backoffice exec playwright install --with-deps chromium
      - name: Smoke (login → board, roles, redirect)
        working-directory: apps/backoffice
        run: |
          eval "$(pnpm exec supabase status --workdir ../backend -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          pnpm exec playwright test --project=desktop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/backoffice/playwright-report
