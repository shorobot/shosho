# SHOSHO — local dev stack. `docker compose up` from apps/infra/.
# Supabase: NOT run locally by default — point .env at the shosho-staging cloud project
# (see README.md "Supabase locally"). `supabase start` is optional.
# n8n was dropped (D-007): orchestration lives in code (FastAPI + Claude Agent SDK + cron).
name: shosho-local

services:
  api:
    # Placeholder FastAPI. S2 replaces `build` with ../automation context.
    build: ./placeholder-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
