# SHOSHO — local dev stack. `docker compose up` from apps/infra/.
# Supabase: NOT run locally by default — point .env at the shosho-staging cloud project
# (see README.md "Supabase locally"). `supabase start` is optional.
name: shosho-local

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.113.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-only-change-me}
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    # Placeholder FastAPI. backend-01 replaces `build` with ../automation context.
    build: ./placeholder-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

volumes:
  n8n_data:
