name: Deploy production

# D-005: prod = git tag v*, manual approve via GitHub Environment "production" (required reviewer: owner).
# Prod target is NOT decided/provisioned (D-004: not on the shared staging box; separate boot after
# S7-01). remote_dir / ports below are placeholders; the workflow fails at the SSH step until PROD_*
# secrets exist, but it never runs without a tag + approval.
on:
  push:
    tags: ["v*"]

# Caller must grant what _deploy.yml needs (packages: write for GHCR); the repo default token is read-only
# and a called workflow cannot exceed its caller → otherwise "startup_failure" (seen in S1-01 runs).
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      image_tag: ${{ github.ref_name }}
      remote_dir: /home/shosho/shosho/prod
      web_port: "8200"
      secret_prefix: PROD
    secrets: inherit
    # secrets: inherit is REQUIRED here — see deploy-staging.yml's comment. Removing it (S1-07's first
    # attempt at S7-01 task 3) broke the real `Deploy staging` run; restored 2026-10-07.
