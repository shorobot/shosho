name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, backoffice]
    steps:
      - uses: actions/checkout@v4

      - name: Detect package.json
        id: detect
        run: |
          if [ -f "apps/${{ matrix.app }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.app }} has no package.json yet — no-op"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present test

  python:
    name: python (automation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect python project
        id: detect
        run: |
          if [ -f apps/automation/pyproject.toml ] || [ -f apps/automation/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/automation has no pyproject/requirements yet — no-op"
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: |
          python -m pip install --upgrade pip ruff pytest
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: ruff check . && ruff format --check .

      - name: Pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: pytest -q || [ $? -eq 5 ]   # exit 5 = no tests collected → ok

  infra:
    name: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Workflows in sync (apps/infra/.github ↔ .github)
        run: diff -r apps/infra/.github/workflows .github/workflows

      - name: Compose files valid
        working-directory: apps/infra
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.staging.yml config -q

      - name: Staging compose respects co-tenant terms (127.0.0.1:8200-8299 only, no 0.0.0.0)
        working-directory: apps/infra
        run: |
          cfg=$(docker compose -f docker-compose.staging.yml config)
          echo "$cfg" | grep -E 'host_ip|published' || true
          ! echo "$cfg" | grep -E 'host_ip: *"?0\.0\.0\.0' || { echo "::error::0.0.0.0 bind in staging compose"; exit 1; }
          echo "$cfg" | grep -E 'published:' | grep -oE '[0-9]+' | while read -r p; do
            [ "$p" -ge 8200 ] && [ "$p" -le 8299 ] || { echo "::error::published port $p outside 8200-8299"; exit 1; }
          done
          echo "$cfg" | grep -E 'published:' | grep -qE '"?8200"?$' || { echo "::error::web must publish 8200"; exit 1; }

      - name: Ruff (placeholder-api)
        run: pipx run ruff check apps/infra/placeholder-api

      - name: Placeholder images build
        run: |
          docker build -q apps/infra/placeholder-api
          docker build -q apps/infra/placeholder-web

      - name: Compose smoke test (api)
        working-directory: apps/infra
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            echo "try $i: api=$api"
            [ "$api" = 200 ] && break
            sleep 5
          done
          docker compose ps
          [ "$api" = 200 ]

      - name: Compose down
        if: always()
        working-directory: apps/infra
        run: docker compose down -v --remove-orphans

  # Single required status check for branch protection.
  ci:
    name: CI
    if: always()
    needs: [node, python, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
