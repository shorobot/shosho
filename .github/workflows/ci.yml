name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: node (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [web, backoffice]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect package.json
        id: detect
        run: |
          if [ -f "apps/${{ matrix.app }}/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/${{ matrix.app }} has no package.json yet — no-op"
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.detect.outputs.present == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: pnpm --filter "./apps/${{ matrix.app }}" run --if-present test

  python:
    name: python (automation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect python project
        id: detect
        run: |
          if [ -f apps/automation/pyproject.toml ] || [ -f apps/automation/requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/automation has no pyproject/requirements yet — no-op"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: |
          python -m pip install --upgrade pip ruff pytest
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: ruff check . && ruff format --check .

      - name: Pytest
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/automation
        run: pytest -q || [ $? -eq 5 ]   # exit 5 = no tests collected → ok

  infra:
    name: infra
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Workflows in sync (apps/infra/.github ↔ .github)
        # Covers every file incl. migrate-staging.yml; a workflow added on one side only fails here.
        run: diff -r apps/infra/.github/workflows .github/workflows

      - name: Compose files valid
        working-directory: apps/infra
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.staging.yml config -q

      - name: Staging compose respects co-tenant terms (127.0.0.1:8200-8299 only, no 0.0.0.0)
        working-directory: apps/infra
        run: |
          # S1-05 pipefail sweep: `grep … | grep -oE … | while read` reported only the while-loop's
          # status (and ran the loop in a subshell), so a compose file that published NO ports at all
          # walked through this guard green. Collect the ports with awk (exit 0 on no match), then
          # assert on them — an empty list is now an explicit failure.
          set -euo pipefail
          cfg=$(docker compose -f docker-compose.staging.yml config)
          echo "$cfg" | grep -E 'host_ip|published' || true
          ! echo "$cfg" | grep -E 'host_ip: *"?0\.0\.0\.0' || { echo "::error::0.0.0.0 bind in staging compose"; exit 1; }
          ports=$(printf '%s\n' "$cfg" | awk '/published:/ { gsub(/[^0-9]/, "", $2); if ($2 != "") print $2 }')
          [ -n "$ports" ] || { echo "::error::staging compose publishes no ports at all — the co-tenant guard has nothing to check"; exit 1; }
          for p in $ports; do
            [ "$p" -ge 8200 ] && [ "$p" -le 8299 ] || { echo "::error::published port $p outside 8200-8299"; exit 1; }
          done
          echo "$ports" | grep -qx 8200 || { echo "::error::web must publish 8200"; exit 1; }

      - name: Ruff (placeholder-api)
        run: pipx run ruff check apps/infra/placeholder-api

      - name: Placeholder images build
        run: |
          docker build -q apps/infra/placeholder-api
          docker build -q apps/infra/placeholder-web

      - name: Compose smoke test (api)
        working-directory: apps/infra
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            echo "try $i: api=$api"
            [ "$api" = 200 ] && break
            sleep 5
          done
          docker compose ps
          [ "$api" = 200 ]

      - name: Compose down
        if: always()
        working-directory: apps/infra
        run: docker compose down -v --remove-orphans


  backend:
    name: backend (supabase)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Supabase CLI version
        run: pnpm exec supabase --version

      - name: Start local Supabase (applies migrations + seed)
        run: pnpm exec supabase start

      - name: db reset (migrations + seed from scratch, must be error-free)
        run: pnpm exec supabase db reset

      - name: db lint (plpgsql_check)
        run: pnpm exec supabase db lint --level warning --fail-on warning

      - name: Seed is idempotent (apply a second time)
        run: |
          # S1-05 pipefail sweep: `eval "$(cmd | sed …)"` reports *eval's* status — a failed
          # `supabase status` produced an empty eval that exited 0, and the step ran on with DB_URL
          # unset. pipefail alone does not fix it (eval discards the substitution's status): assign
          # first so `set -e` sees the failure, and let `set -u` catch a missing DB_URL.
          set -euo pipefail
          status_env=$(pnpm exec supabase status -o env | sed 's/^/export /')
          eval "$status_env"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      - name: Typecheck tests
        run: pnpm run typecheck

      - name: Integration tests (vitest against local Supabase)
        run: |
          # Same shape as the step above — see the note there.
          set -euo pipefail
          status_env=$(pnpm exec supabase status -o env | sed 's/^/export /')
          eval "$status_env"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          pnpm test

      - name: Generated types are up to date
        run: |
          pnpm run --silent db:types
          git diff --exit-code -- types/database.ts \
            || { echo "::error::types/database.ts is stale — run 'pnpm --filter @shosho/backend db:types' and commit"; exit 1; }

      - name: Upload generated types
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-types
          path: apps/backend/types/database.ts

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  # S6-01: cross-app Playwright suite (apps/e2e) against a local Supabase stack — no staging, no Stripe
  # keys needed (every spec here uses cash / v1 client-reported payment, never create-payment-intent).
  # Deliberately NOT in the `ci` gate's `needs` below: browser install + two Next dev servers booting is
  # a materially flakier, slower gate than anything else in that list today (S3-01/S4-01 kept their own
  # Playwright smoke out of the required check for the same reason — see apps/e2e/README.md). It still
  # runs on every PR and reports its own status; promote it into `needs` once it's proven stable.
  e2e:
    name: e2e (apps/e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm --filter @shosho/e2e exec playwright install --with-deps chromium

      - name: Start local Supabase (applies migrations + seed)
        working-directory: apps/backend
        run: pnpm exec supabase start

      - name: Run the suite against the local stack
        run: |
          set -euo pipefail
          status_env=$(pnpm --filter @shosho/backend exec supabase status -o env | sed 's/^/export /')
          eval "$status_env"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          # S2-05: seed.sql gives every staff account a random password; this sets the documented
          # local-only one ("local-dev-only") that apps/e2e/helpers/db.ts expects.
          pnpm --filter @shosho/backend run seed:local-logins
          pnpm --filter @shosho/e2e exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        working-directory: apps/backend
        run: pnpm exec supabase stop --no-backup

  # Single required status check for branch protection.
  ci:
    name: CI
    if: always()
    needs: [node, python, infra, backend]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
