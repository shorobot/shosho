name: S3 verify (temporary)

# [S3-01] one-off verification of the guest site against a real Supabase + the Docker image.
# Removed before merge — CI's `node (web)` job covers lint/typecheck/unit tests permanently.
on:
  workflow_dispatch:
  push:
    branches: [s3-01]

permissions:
  contents: read

jobs:
  web-integration:
    name: web ↔ local Supabase (place_order → tracking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (migrations + seed)
        working-directory: apps/backend
        run: pnpm exec supabase start
      - name: Integration tests through lib/api-supabase.ts
        working-directory: apps/backend
        run: |
          eval "$(pnpm exec supabase status -o env | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          pnpm --filter @shosho/web test:integration
      - name: Playwright smoke (mock API, desktop + 375 px)
        working-directory: apps/web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - name: Stop Supabase
        if: always()
        working-directory: apps/backend
        run: pnpm exec supabase stop --no-backup

  web-image:
    name: docker image (size, RAM under 96m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: shosho-web:verify
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Run under the staging limits and hit every route
        run: |
          docker image inspect shosho-web:verify --format 'image size: {{.Size}} bytes'
          docker run -d --name web -p 127.0.0.1:8200:3000 --memory 96m --memory-swap 96m \
            -e NEXT_PUBLIC_SUPABASE_URL=https://bvmitglwwqsvufetlkff.supabase.co -e NEXT_PUBLIC_SUPABASE_ANON_KEY=not-a-key \
            shosho-web:verify
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8200/ || true); echo "try $i: $code"
            [ "$code" = 200 ] && break; sleep 3
          done
          [ "$code" = 200 ]
          for p in / /about /menu/philadelphia-deluxe-rl-014 /checkout /order /order/x /impressum /agb /datenschutz /widerruf /nope; do
            printf '%s ' "$p"; curl -s -o /dev/null -w '%{http_code} %{time_total}s\n' "http://127.0.0.1:8200$p"
          done
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8200/; curl -s -o /dev/null http://127.0.0.1:8200/about; done
          docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'
          docker inspect web --format 'OOMKilled={{.State.OOMKilled}} Status={{.State.Status}}'
          docker logs web | tail -20
          [ "$(docker inspect web --format '{{.State.OOMKilled}}')" = false ]
