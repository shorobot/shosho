name: Deploy staging

# Runs after CI succeeds on main (D-005: staging = main, auto-deploy).
# Target: shared droplet, user `shos`, rootless docker, 127.0.0.1:8200 (web) / :8201 (api) — D-004.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Caller must grant what _deploy.yml needs (packages: write for GHCR); the repo default token is read-only
# and a called workflow cannot exceed its caller → otherwise "startup_failure" (seen in S1-01 runs).
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image_tag: staging
      remote_dir: /home/shos/shosho/staging
      web_port: "8200"
      api_port: "8201"
    secrets:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
