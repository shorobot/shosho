name: Deploy staging

# Chain on main (D-005: staging = main, auto-deploy):  CI ──▶ Migrate staging ──▶ Deploy staging.
# Runs only after the schema push succeeded, so code never ships against a failed migration.
# Target: shared droplet, user `shos`, rootless docker, 127.0.0.1:8200 (web) / :8202 (back-office) — D-004.
# :8201 stays reserved for SH.OS but is idle — D-013 dropped the api placeholder (2026-09-27).
on:
  workflow_run:
    workflows: [Migrate staging]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Caller must grant what _deploy.yml needs (packages: write for GHCR); the repo default token is read-only
# and a called workflow cannot exceed its caller → otherwise "startup_failure" (seen in S1-01 runs).
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image_tag: staging
      remote_dir: /home/shos/shosho/staging
      web_port: "8200"
      backoffice_port: "8202"
      secret_prefix: STAGING
    secrets: inherit
    # secrets: inherit is REQUIRED here — restored 2026-10-07 after removing it broke the real deploy
    # (run 37640250636: SSH_HOST/SSH_USER resolved empty, failed at "SSH setup" before touching the
    # server). S1-07 had reasoned from GitHub's reusable-workflow docs that _deploy.yml's `deploy` job
    # declaring `environment: staging` on itself would resolve STAGING_* directly, no forwarding
    # needed. That reasoning was wrong, proven by the actual run: the doc sentence it relied on
    # ("the environment secret will be used, not the secret passed from the caller") is a
    # name-COLLISION tie-break, not a statement that environment-scoped secrets populate with zero
    # pass-through at all. Without `inherit` (or an explicit map), a called job gets nothing. Verify
    # in the Actions log, not from the docs, before touching this again.
