name: Deploy staging

# Chain on main (D-005: staging = main, auto-deploy):  CI ──▶ Migrate staging ──▶ Deploy staging.
# Runs only after the schema push succeeded, so code never ships against a failed migration.
# Target: shared droplet, user `shos`, rootless docker, 127.0.0.1:8200 (web) / :8201 (api) / :8202 (back-office) — D-004.
on:
  workflow_run:
    workflows: [Migrate staging]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Caller must grant what _deploy.yml needs (packages: write for GHCR); the repo default token is read-only
# and a called workflow cannot exceed its caller → otherwise "startup_failure" (seen in S1-01 runs).
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      image_tag: staging
      remote_dir: /home/shos/shosho/staging
      web_port: "8200"
      api_port: "8201"
      backoffice_port: "8202"
      secret_prefix: STAGING
    secrets: inherit   # resolved inside _deploy.yml from environment `staging`
